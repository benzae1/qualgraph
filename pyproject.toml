[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qualgraph"
version = "0.1.0"
description = "Graph-aware code quality analysis for Python repositories."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Qualgraph contributors" },
]
keywords = [
  "code-quality",
  "code-analysis",
  "knowledge-graph",
  "static-analysis",
  "llm",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "tree-sitter==0.21.3",
  "tree-sitter-python==0.21.0",
  "networkx==3.3",
  "leidenalg==0.10.2",
  "python-igraph==0.11.6",
  "radon==6.0.1",
  "docstring-parser==0.16",
  "ruff==0.15.11",
  "vulture==2.13",
  "coverage==7.6.1",
  "bandit==1.7.10",
  "pip-audit==2.7.3",
  "detect-secrets==1.5.0",
  "mypy==1.11.2",
  "GitPython==3.1.43",
  "pydantic==2.9.2",
  "pyyaml==6.0.2",
  "typer==0.12.5",
  "click==8.1.7",
  "rich==13.9.2",
  "jinja2==3.1.4",
  "anthropic==0.98.1",
  "openai==1.51.0",
  "httpx==0.27.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "twine>=5.1",
  "playwright>=1.49",
]

[project.urls]
Homepage = "https://github.com/benzae1/analytify"
Repository = "https://github.com/benzae1/analytify"
Issues = "https://github.com/benzae1/analytify/issues"
Changelog = "https://github.com/benzae1/analytify/blob/main/CHANGELOG.md"

[project.scripts]
qualgraph = "qualgraph.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qualgraph = [
  "report/templates/*.j2",
  "viewer/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "benchmarks/repos/tiny_repo"]
markers = [
  "e2e: browser-backed viewer checks",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
  ".git",
  ".qualgraph",
  ".venv",
  "benchmarks/repos/aiohttp",
  "benchmarks/repos/scrapy",
  "benchmarks/repos/starlette",
  "graphify-out",
  "src/qualgraph/graphify-out",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "RUF"]
ignore = ["B008", "E501"]

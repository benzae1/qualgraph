name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check dependency environment
        run: python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Unit tests
        run: python -m pytest tests/unit -q

  package-smoke:
    name: Build and wheel smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install wheel in a fresh environment
        run: |
          python -m venv /tmp/qualgraph-wheel
          /tmp/qualgraph-wheel/bin/python -m pip install --upgrade pip
          /tmp/qualgraph-wheel/bin/python -m pip install dist/*.whl pytest
          /tmp/qualgraph-wheel/bin/qualgraph --help
          /tmp/qualgraph-wheel/bin/python -m qualgraph --help

      - name: CLI workflow smoke
        run: |
          /tmp/qualgraph-wheel/bin/qualgraph analyze benchmarks/repos/tiny_repo \
            --preset fast \
            --coverage-mode skip \
            --top-n 5 \
            --output-dir .qualgraph/ci \
            --artifacts-dir .qualgraph/runs
          /tmp/qualgraph-wheel/bin/qualgraph report .qualgraph/ci/annotated.graph.json --output .qualgraph/ci/report-again.md
          /tmp/qualgraph-wheel/bin/qualgraph export-json .qualgraph/ci/annotated.graph.json --output .qualgraph/ci/export-again.json
          /tmp/qualgraph-wheel/bin/qualgraph llm export-tasks .qualgraph/ci/annotated.graph.json --limit 1 --output-dir .qualgraph/ci/llm_tasks

      - name: Viewer API smoke
        run: |
          /tmp/qualgraph-wheel/bin/qualgraph serve .qualgraph/ci/annotated.graph.json --port 8765 &
          server_pid=$!
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/api/health; then
              kill "$server_pid"
              wait "$server_pid" || true
              exit 0
            fi
            sleep 0.5
          done
          kill "$server_pid" || true
          exit 1

  viewer-e2e:
    name: Viewer browser checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Browser-backed viewer tests
        run: python -m pytest tests/e2e -q
